<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Church Login form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jquery-confirm/3.3.4/jquery-confirm.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
  <body>

    <div class="container">
        <div class="form-box login">
          <form id="login-form">
            <h1>Login</h1>
            <div class="input-box">
              <input type="text" placeholder="Username" required>
              <i class="bi bi-person-fill"></i>
            </div>
            <div class="input-box">
              <input type="password" placeholder="Password" required>
              <i class="bi bi-lock-fill"></i>
            </div>
            <div class="forgot-link">
              <a href="#">Forgot Password?</a>
            </div>
            <button type="submit" class="btn">Login</button>
            <p>Or login with social platforms</p>
            <div class="social-icons">
              <a href="#"><i class="bi bi-google"></i></a>
              <a href="#"><i class="bi bi-facebook"></i></a>
              <a href="#"><i class="bi bi-envelope-fill"></i></a>
            </div>
          </form>
        </div>

        <div class="form-box register">
          <form id="login-form">
              <h1>Registeration</h1>
              <div class="input-box">
                <input type="text" placeholder="Username" required>
                <i class="bi bi-person-fill"></i>
              </div>
              <div class="input-box">
                <input type="email" placeholder="Email" required>
                <i class="bi bi-envelope-fill"></i>
              </div>
              <div class="input-box">
                <input type="password" placeholder="Password" required>
                <i class="bi bi-lock-fill"></i>
              </div>
              <button type="submit" class="btn">Register</button>
              <p>Or register with social platforms</p>
              <div class="social-icons">
                <a href="#"><i class="bi bi-google"></i></a>
                <a href="#"><i class="bi bi-facebook"></i></a>
                <a href="#"><i class="bi bi-envelope-fill"></i></a>
              </div>
            </form>
          </div>

          <div class="toggle-box">
            <div class="toggle-panel toggle-left">
              <h1>Hello, Welcome!</h1>
              <p>Don't have an account?</p>
              <button class="btn register-btn" type="button">Register</button>
            </div> 
            <div class="toggle-panel toggle-right">
              <h1>Welcome Back!</h1>
              <p>Already have an account?</p>
              <button class="btn login-btn" type="button">Login</button>
            </div>    
          </div>
    </div>


    <!--  direct me to the church page -->
    <script>
      document.getElementById("login-form").addEventListener("submit", function(event) {
        event.preventDefault(); 
        // Redirect to church.html
        window.location.href = "church.html";
      });
    </script>
        
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script type="text/javascript" src="js/estyle.js"></script>
  </body>
</html>
